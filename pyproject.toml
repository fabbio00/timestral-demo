[project]
name = "timestral-demo"
version = "0.1.0"
description = "Timestral vs Chronos-2 benchmark demo on industrial energy data"
requires-python = ">=3.12"
dependencies = [
    "chronos-forecasting>=2.0",
    "huggingface-hub>=2.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "timestral",
]

[tool.uv.sources]
timestral = { git = "https://github.com/mistralai/timestral.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo"]
